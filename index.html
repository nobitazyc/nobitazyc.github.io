.bubble.on{transform:scale(1);opacity:1}

@view-transition{navigation:auto}
::view-transition-image-pair(root){isolation:auto}

/* ---------- helpers ---------- */
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const smooth=(a,b,v)=>{const t=clamp((v-a)/(b-a),0,1);return t*t*(3-2*t)};
const easeInCubic=t=>t*t*t;
const easeOutQuad=t=>1-(1-t)*(1-t);
const AOUT=1; // the outgoing scene stays for the whole transition: the rising wipe covers it, it doesn't vanish ahead of the colour
const easeOutBack=(t,s=1.7)=>{const c3=s+1;return 1+c3*Math.pow(t-1,3)+s*Math.pow(t-1,2)};
const easeOutElastic=t=>t<=0?0:t>=1?1:Math.pow(2,-10*t)*Math.sin((t*10-.75)*(2*Math.PI/3))+1;
const easeOutBounce=t=>{const n=7.5625,d=2.75;if(t<1/d)return n*t*t;if(t<2/d)return n*(t-=1.5/d)*t+.75;if(t<2.5/d)return n*(t-=2.25/d)*t+.9375;return n*(t-=2.625/d)*t+.984375};
const easeOutExpo=t=>t>=1?1:1-Math.pow(2,-10*t);
/* write a style only when the value changes: rewriting transforms on a panel's ancestors every frame cancels touch scrolling inside it on mobile */
const st=(el,p,v)=>{const c=el._st||(el._st={});if(c[p]!==v){c[p]=v;el.style[p]=v}};

/* ---------- abstract colour-block figure ---------- */
function fig(pose,c){
  const bar=(x1,y1,x2,y2,w,col)=>`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${col}" stroke-width="${w}" stroke-linecap="round"/>`;
  const head=(x,y,r)=>`<circle cx="${x}" cy="${y}" r="${r}" fill="${c.head}"/>`;
  const bun=(x,y,r)=>`<circle cx="${x}" cy="${y}" r="${r}" fill="${c.hair}"/>`;
  let body='';
  switch(pose){
    case 'bust':
      body=`<path d="M22 260 L22 190 A78 78 0 0 1 178 190 L178 260 Z" fill="${c.body}"/>`+bar(140,225,192,124,28,c.body)+`<circle cx="194" cy="108" r="17" fill="${c.body}"/>`+head(100,104,44)+bun(140,70,18);break;
    case 'point':
      body=`<rect x="68" y="70" width="64" height="96" rx="32" fill="${c.body}"/>`+bar(84,160,78,250,22,c.body)+bar(116,160,124,250,22,c.body)+bar(126,92,192,68,20,c.body)+`<circle cx="194" cy="66" r="12" fill="${c.body}"/>`+bar(74,96,66,164,20,c.body)+head(100,40,26)+bun(122,20,11);break;
    case 'dance':{
      const one=(col,op)=>`<g opacity="${op}"><g transform="rotate(-8 100 120)"><rect x="68" y="70" width="64" height="96" rx="32" fill="${col}"/></g>`+bar(126,86,176,22,20,col)+bar(74,86,28,34,20,col)+bar(86,160,58,246,22,col)+bar(116,160,152,236,22,col)+(op===1?head(100,40,26)+bun(122,20,11):`<circle cx="100" cy="40" r="26" fill="${col}"/>`)+`</g>`;
      body=`<g transform="translate(-40 0)">${one(c.hair,.28)}</g><g transform="translate(-20 0)">${one(c.hair,.5)}</g>${one(c.body,1)}`;break}
    case 'type':
      body=`<rect x="98" y="152" width="100" height="10" rx="5" fill="${c.body}"/>`+bar(176,78,168,138,8,c.body)+bar(112,140,178,140,8,c.body)+`<rect x="40" y="82" width="60" height="84" rx="28" fill="${c.body}"/>`+bar(90,112,148,138,20,c.body)+bar(62,166,62,250,22,c.body)+bar(62,166,108,166,22,c.body)+bar(108,166,108,250,22,c.body)+head(70,50,26)+bun(50,30,11)+`<rect x="150" y="70" width="34" height="6" fill="${c.accent}"/>`;break;
    case 'launch':
      body=`<rect x="68" y="70" width="64" height="96" rx="32" fill="${c.body}"/>`+bar(84,160,78,250,22,c.body)+bar(116,160,124,250,22,c.body)+bar(126,88,168,26,20,c.body)+bar(74,96,60,150,20,c.body)+head(100,40,26)+bun(122,20,11)+`<path d="M160 22 L200 4 L182 40 Z" fill="${c.accent}"/>`;break;
    case 'wave':

  }
  return `<svg viewBox="0 0 200 260" preserveAspectRatio="xMidYMax meet" width="100%" height="100%" overflow="visible">${body}</svg>`;
}

      case 'diag':tr=`translateX(${-Math.min(po*W*.5,Math.max(0,pLag)*W)}px) rotate(${-po*9}deg)`;st(A.el,'transformOrigin','0% 100%');break;
      case 'blob':tr=`scale(${1+po*.35})`;st(A.el,'transformOrigin','50% 50%');st(A.el,'opacity',1-po);break;
    }
    if(type!=='blob')st(A.el,'opacity',1-tt);   /* fades steadily from the first pixel of the transition, gone by the end */
    st(A.el,'transform',tr+` scaleY(${1+sq*(type==='right'||type==='diag'?0:1)}) scaleX(${1+sq*(type==='right'||type==='diag'?1:0)})`);
    A.shapes.forEach(sh=>{st(sh.el,'transform',`rotate(${sh.rot}deg)`);st(sh.el,'opacity',1)});
    A.copyParts.forEach(c=>{st(c.el,'transform','none');st(c.el,'opacity',1)});
  }
  /* incoming scene B */
  if(f>T0){
    st(B.el,'transform',`scaleY(${1+sq}) `);st(B.el,'transformOrigin','50% 100%');st(B.el,'opacity',1);
    const pi=f>=T1?1:te;
    B.shapes.forEach(sh=>{const q=clamp((pi*1.5-sh.d)/(1),0,1);let tr='';
      switch(type){
        case 'up':tr=`translateY(${(1-easeOutBack(q,1.6))*H*.45}px)`;break;
        case 'snap':tr=`translateY(${-(1-easeOutBounce(q))*H*.45}px)`;break;
        case 'right':tr=`translateX(${(1-easeOutBack(q,1.4))*W*.4}px) skewX(${(1-q)*-8}deg)`;break;
        case 'diag':tr=`translateX(${(1-easeOutBack(q,1.4))*W*.35}px) rotate(${(1-q)*10}deg)`;break;
        case 'blob':tr=`scale(${easeOutBack(q,2.2)})`;break;
      }
      st(sh.el,'transform',tr+` rotate(${sh.rot}deg)`);
      st(sh.el,'opacity',smooth(0,.45,q))});
    B.copyParts.forEach(c=>{const q=clamp((pi*1.6-c.d-.25),0,1);const e=easeOutBack(q,1.1);
      st(c.el,'transform',`translateY(${(1-e)*60}px)`);st(c.el,'opacity',q)});
  }

  /* UI */
  progress.style.width=(r*100)+'%';
  const cn=Math.round(s)+1;counter.textContent=String(cn).padStart(2,'0')+' / '+String(N).padStart(2,'0');
  st(hint,'opacity',1-smooth(.01,.05,r));
  navBtns.forEach((b,j)=>b.classList.toggle('on',j===Math.round(s)));
  requestAnimationFrame(frame);
}
/* ---------- easter egg: poke 20 different letters ---------- */
const egg={count:0,fired:0,need:()=>matchMedia('(pointer: coarse)').matches?8:30, /* touch screens: fewer pokes */
  poke(ch){if(ch._busy)return; /* counts each real pop, not re-entries mid-animation */
    if(++this.count>=this.need()){this.count=0;this.fired++;this.party()}},
  party(){const pal=[C.coral,C.yellow,C.blue,C.mint,C.pink,C.lilac,C.cream];
    const box=document.createElement('div');box.className='party';document.body.appendChild(box);
    for(let k=0;k<90;k++){const i=document.createElement('i');const sz=8+Math.random()*22;
      i.style.cssText=`left:${Math.random()*100}vw;width:${sz}px;height:${Math.random()<.3?sz:sz*(.4+Math.random()*.8)}px;--c:${pal[k%pal.length]};--r:${['50%','0','30% 70% 70% 30% / 30% 30% 70% 70%','2px'][k%4]};--x:${(Math.random()-.5)*30}vw;--d:${2.4+Math.random()*2}s;--dl:${Math.random()*.8}s;--t:${1+Math.random()*2}s`;box.appendChild(i)}
    setTimeout(()=>box.remove(),5500);
    /* ripple every headline letter on screen */
    const sc=S[curBase];if(sc){[...sc.copy.querySelectorAll('h1 .ch')].forEach((ch,j)=>setTimeout(()=>{ch.classList.remove('fx-wave');void ch.offsetWidth;ch.classList.add('fx-wave');ch.style.color=pal[j%pal.length];setTimeout(()=>ch.style.color='',900)},j*45))}
    const msgs=[`You poked ${this.need()} letters. They liked it.`,'Still here? The letters appreciate the attention.','Okay, you really like these letters.','At this point we should just be friends.'];
    let t=document.querySelector('.toast');if(!t){t=document.createElement('div');t.className='toast';document.body.appendChild(t)}
    t.textContent=msgs[Math.min(this.fired-1,msgs.length-1)];t.classList.add('on');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('on'),3800)}};
/* random letter pops on the current scene */
let curBase=0;
(function tick(){const sc=S[curBase];if(sc&&sc.el.classList.contains('on')&&sc.el._playRandomLetter)sc.el._playRandomLetter();setTimeout(tick,3200+Math.random()*1600)})();
/* view transitions to/from the case studies: only the card involved gets a view-transition-name, and only while the transition runs.
   A permanently named thumbnail is lifted out of the gallery's scroll clip for the whole animation, which shows as a one-second flash of cards outside the frame. */
const cardFor=url=>{const path=(url||'').split('?')[0].split('#')[0];return [...document.querySelectorAll('.gal figure.has-cs')].find(f=>{const a=f.querySelector('a');return a&&path.endsWith(a.getAttribute('href'))})};
const clearCardNames=()=>document.querySelectorAll('.gal img[data-vt]').forEach(i=>{i.style.viewTransitionName=''});
addEventListener('pageswap',e=>{if(!e.viewTransition)return;clearCardNames();const to=e.activation&&e.activation.entry&&e.activation.entry.url;const fig=cardFor(to);if(fig){const img=fig.querySelector('img');img.style.viewTransitionName=img.dataset.vt}});
addEventListener('pagereveal',e=>{clearCardNames();if(!e.viewTransition)return;const from=(window.navigation&&navigation.activation&&navigation.activation.from&&navigation.activation.from.url)||document.referrer||'';
  const fig=cardFor(from);if(!fig)return;const g=fig.closest('.gscroll');if(g)g.scrollTop=Math.max(0,fig.offsetTop-(g.clientHeight-fig.offsetHeight)/2);
  const img=fig.querySelector('img');img.style.viewTransitionName=img.dataset.vt;e.viewTransition.finished.finally(clearCardNames)});
frame(performance.now()); /* draw the first frame synchronously: no empty stage on first paint, and view transitions snapshot a real scene */
</script>
