<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yucong Zhou — Portfolio (prototype v20)</title>
<style>
:root{--fg:#141414;--cw:100vw;--ch:100vh}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:auto}
body{height:1000vh;background:#ffffff;font-family:Inter,"Helvetica Neue",Helvetica,-apple-system,"PingFang SC","Noto Sans SC",sans-serif;color:var(--fg);overflow-x:hidden}
#stage{position:fixed;inset:0;overflow:hidden}
#bg{position:absolute;inset:0}
#wipe{position:absolute;inset:0;width:100%;height:100%;display:block}
.scene{position:absolute;inset:0;visibility:hidden;will-change:transform}
.scene.on{visibility:visible}
.art{position:absolute;left:0;bottom:0;width:var(--cw);height:var(--ch)}
.shape{position:absolute;will-change:transform;pointer-events:auto;left:var(--dl);top:var(--dt);bottom:var(--db);width:var(--dw);height:var(--dh)}
.shape.txt .fx{font-size:var(--dfs)}
.shape.geo .fx{border-radius:var(--dr)}
.shape .fx{width:100%;height:100%;display:block;transition:background .35s,border-color .35s}
.shape.tri .fx{clip-path:polygon(50% 0,100% 100%,0 100%)}
.shape.slot .fx{display:grid;place-items:center;opacity:.9}
.shape.slot .fx span{font-size:12px;letter-spacing:.16em;text-transform:uppercase;opacity:.6;text-align:center;padding:0 1vw}
.shape.img .fx img{width:100%;height:100%;object-fit:contain;object-position:bottom center;display:block;filter:drop-shadow(0 18px 30px rgba(20,20,20,.12))}
.idle-a{animation:idleA var(--dur) ease-in-out var(--del) infinite}
.idle-b{animation:idleB var(--dur) ease-in-out var(--del) infinite}
.idle-c{animation:idleC var(--dur) ease-in-out var(--del) infinite}
.idle-d{animation:idleD var(--dur) ease-in-out var(--del) infinite}
@keyframes idleA{0%,100%{transform:translate(0,0) rotate(0)}33%{transform:translate(4px,-7px) rotate(1.5deg)}66%{transform:translate(-3px,4px) rotate(-1deg)}}
@keyframes idleB{0%,100%{transform:scale(1) rotate(0)}50%{transform:scale(1.04) rotate(-2deg)}}
@keyframes idleC{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
@keyframes idleD{0%,100%{transform:rotate(0) scale(1)}25%{transform:rotate(2deg) scale(1.02)}75%{transform:rotate(-2deg) scale(.98)}}
.gal{height:100%;overflow-y:auto;overscroll-behavior:contain;border-radius:1.5vw;background:#141414;color:#f4efe6;padding:1.4vw;scrollbar-width:thin;scrollbar-color:#f4efe6 transparent}
.gal::-webkit-scrollbar{width:6px}.gal::-webkit-scrollbar-thumb{background:#f4efe6;border-radius:3px}.gal::-webkit-scrollbar-track{background:transparent}
.galhead{display:flex;justify-content:space-between;font-size:11px;letter-spacing:.2em;text-transform:uppercase;opacity:.6;padding:.2vw .2vw 1.2vw}
.gal figure{margin:0 0 1.6vw}
.gal img{width:100%;display:block;border-radius:.9vw;background:#f4efe6;transition:transform .5s cubic-bezier(.34,1.3,.64,1)}
.gal figure:hover img{transform:scale(1.015)}
.gal figcaption{display:flex;gap:1vw;align-items:flex-start;padding:.9vw .2vw 0}
.gal figcaption b{font-size:1.6vw;font-weight:800;letter-spacing:-.05em;line-height:1;color:#ffc93c}
.gal figcaption strong{display:block;font-size:.95vw;font-weight:600;letter-spacing:-.01em}
.gal figcaption span{display:block;font-size:.75vw;opacity:.6;margin-top:.25vw;letter-spacing:.02em}
.tl{height:100%;overflow-y:auto;overscroll-behavior:contain;border-radius:1.5vw;background:#141414;color:#f4efe6;padding:1.4vw 1.6vw;scrollbar-width:thin;scrollbar-color:#f4efe6 transparent}
.tl::-webkit-scrollbar{width:6px}.tl::-webkit-scrollbar-thumb{background:#f4efe6;border-radius:3px}
.tli{display:grid;grid-template-columns:7.5vw 1.4vw 1fr;gap:0 1vw;position:relative;padding:0 0 1.8vw}
.tli .when{font-size:.75vw;letter-spacing:.14em;text-transform:uppercase;color:#ffc93c;padding-top:.35vw;font-variant-numeric:tabular-nums}
.tli .dot{width:1vw;height:1vw;border-radius:50%;background:#f4efe6;margin-top:.3vw;position:relative;z-index:1;transition:transform .4s cubic-bezier(.34,1.56,.64,1),background .3s}
.tli:hover .dot{transform:scale(1.5);background:#ffc93c}
.tli::before{content:"";position:absolute;left:calc(7.5vw + 1vw + .5vw - 1px);top:1.2vw;bottom:0;width:2px;background:#f4efe6;opacity:.25}
.tli:last-child::before{display:none}
.tli{cursor:pointer;outline:none;border-radius:.6vw;margin:0 -.6vw;padding-left:.6vw;padding-right:.6vw;transition:background .3s}
.tli:hover,.tli:focus-visible{background:rgba(244,239,230,.06)}
.tli .hd{display:flex;align-items:flex-start;justify-content:space-between;gap:1vw}
.tli .chev{font-style:normal;font-weight:600;font-size:1.2vw;line-height:1;opacity:.5;transition:transform .5s cubic-bezier(.34,1.56,.64,1),opacity .3s}
.tli.open .chev{transform:rotate(45deg);opacity:1;color:#ffc93c}
.tli .more{display:grid;grid-template-rows:0fr;transition:grid-template-rows .55s cubic-bezier(.4,0,.2,1)}
.tli .more>div{overflow:hidden}
.tli.open .more{grid-template-rows:1fr}
.tli.open .dot{background:#ffc93c;transform:scale(1.5)}
.tli ul{margin:.7vw 0 0 1vw;padding:0;font-size:.8vw;line-height:1.55;opacity:.85}
.tli ul li{margin-bottom:.25vw}
.tli .stack{display:flex;gap:.5vw;flex-wrap:wrap;margin-top:.9vw;padding-bottom:.3vw}
.tli .stack em{font-style:normal;font-size:.7vw;letter-spacing:.06em;border:1px solid rgba(244,239,230,.35);border-radius:999px;padding:.25vw .7vw}
.tli strong{display:block;font-size:1.05vw;font-weight:600;letter-spacing:-.01em;line-height:1.2}
.tli span{display:block;font-size:.8vw;opacity:.65;margin-top:.25vw}
.tli p{font-size:.8vw;line-height:1.5;opacity:.8;margin-top:.5vw;max-width:26vw}
.car{display:flex;flex-direction:column;gap:1.2vw}
.car .frame{position:relative;width:100%;aspect-ratio:16/9;border-radius:1.5vw;overflow:hidden;background:#141414}
.car .track{display:flex;height:100%;transition:transform .75s cubic-bezier(.34,1.25,.64,1)}
.car .slide{position:relative;flex:0 0 100%;height:100%}
.car .slide iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.car .cover{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1vw;cursor:pointer;transition:transform .6s cubic-bezier(.34,1.56,.64,1)}
.car .cover:hover{transform:scale(1.03)}
.car .cover b{position:absolute;left:2vw;top:1.2vw;font-size:6vw;font-weight:800;letter-spacing:-.06em;line-height:1;opacity:.9}
.car .cover i{width:0;height:0;border-left:3.2vw solid currentColor;border-top:2vw solid transparent;border-bottom:2vw solid transparent;margin-left:.6vw;transition:transform .5s cubic-bezier(.34,1.56,.64,1)}
.car .cover:hover i{transform:scale(1.2)}
.car .cover span{font-size:12px;letter-spacing:.16em;text-transform:uppercase;opacity:.7}
.car .ctl{display:flex;align-items:center;gap:1.2vw;color:#f4efe6}
.car .ctl button{width:3vw;height:3vw;border-radius:50%;border:0;background:#f4efe6;color:#141414;font:700 1.2vw/1 Inter,sans-serif;cursor:pointer;transition:transform .4s cubic-bezier(.34,1.56,.64,1),background .3s}
.car .ctl button:hover{transform:scale(1.15) rotate(-8deg);background:#ffc93c}
.car .cnt{font-size:12px;letter-spacing:.2em;font-variant-numeric:tabular-nums}
.car .dots{display:flex;gap:.6vw;margin-left:auto}
.car .dots i{width:.7vw;height:.7vw;border-radius:50%;background:#f4efe6;opacity:.35;transition:all .3s}
.car .dots i.on{opacity:1;transform:scale(1.4);background:#ffc93c}
.fx-jelly{animation:fxJelly .7s cubic-bezier(.34,1.56,.64,1)}
.fx-spin{animation:fxSpin .8s cubic-bezier(.34,1.4,.64,1)}
.fx-wobble{animation:fxWobble .8s ease-out}
.fx-jump{animation:fxJump .7s cubic-bezier(.34,1.56,.64,1)}
.fx-morph{animation:fxMorph .9s ease-in-out}
.fx-shake{animation:fxShake .5s ease-out}
.fx-flip{animation:fxFlip .8s cubic-bezier(.34,1.3,.64,1)}
.fx-squish{animation:fxSquish .6s cubic-bezier(.34,1.56,.64,1)}
@keyframes fxJelly{0%{transform:scale(1)}25%{transform:scale(1.25,.75)}50%{transform:scale(.85,1.15)}75%{transform:scale(1.08,.94)}100%{transform:scale(1)}}
@keyframes fxSpin{to{transform:rotate(360deg)}}
@keyframes fxWobble{0%{transform:rotate(0)}20%{transform:rotate(14deg)}40%{transform:rotate(-11deg)}60%{transform:rotate(7deg)}80%{transform:rotate(-4deg)}100%{transform:rotate(0)}}
@keyframes fxJump{0%{transform:translateY(0)}40%{transform:translateY(-22%) scale(1.05)}70%{transform:translateY(4%) scale(.97)}100%{transform:translateY(0)}}
@keyframes fxMorph{0%,100%{transform:none}50%{border-radius:60% 40% 30% 70% / 60% 30% 70% 40%;transform:rotate(12deg) scale(1.08)}}
@keyframes fxShake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8%)}40%{transform:translateX(8%)}60%{transform:translateX(-5%)}80%{transform:translateX(4%)}}
@keyframes fxFlip{to{transform:perspective(600px) rotateY(360deg)}}
@keyframes fxSquish{0%{transform:scaleY(1)}35%{transform:scaleY(.55) translateY(40%)}70%{transform:scaleY(1.12) translateY(-6%)}100%{transform:scaleY(1)}}
.copy{pointer-events:auto}
.copy h1 .l{white-space:normal}
.copy h1 .l>span{display:inline-block;max-width:100%}
.copy h1 .w{display:inline-block;white-space:nowrap}
.copy h1 .ch{display:inline-block;transition:color .3s;cursor:default}
.copy p,.copy .k,.copy .tags span{transition:transform .35s cubic-bezier(.34,1.56,.64,1),color .3s}
.copy .tags span{cursor:default}

.shape.txt{font-weight:800;letter-spacing:-.06em;line-height:.85;white-space:nowrap}
.copy{position:absolute;left:8vw;top:var(--ct,50%);transform:translateY(-50%);max-width:44vw;will-change:transform}
.copy .k{font-size:12px;letter-spacing:.24em;text-transform:uppercase;opacity:.7;margin-bottom:22px}
.copy h1{font-size:clamp(56px,10.5vw,176px);font-weight:800;letter-spacing:-.05em;line-height:.88}
.copy h1 .l{display:block;overflow:visible;padding-bottom:.06em}
.copy h1 .l span{display:inline-block;will-change:transform}
.copy p{margin-top:26px;font-size:clamp(15px,1.25vw,19px);line-height:1.55;max-width:34vw;opacity:.85}
.copy .tags{margin-top:20px;display:flex;gap:10px;flex-wrap:wrap}
.copy .tags span{font-size:12px;letter-spacing:.06em;border:1.5px solid currentColor;border-radius:999px;padding:6px 12px}
.copy .links{margin-top:30px;display:flex;gap:26px;font-size:14px;letter-spacing:.06em;pointer-events:auto}
.copy .links a{color:inherit;text-decoration:none;border-bottom:2px solid currentColor;padding-bottom:3px}
.ui{position:fixed;inset:0;pointer-events:none;z-index:5;color:var(--fg)}
.brand{position:absolute;top:28px;left:32px;font-size:12px;letter-spacing:.2em;text-transform:uppercase;font-weight:600}
.brand span{opacity:.6;margin-left:14px;letter-spacing:.06em;text-transform:none;font-weight:400}
.progress{position:absolute;top:0;left:0;height:3px;background:currentColor;width:0}
.counter{position:absolute;right:32px;top:26px;font-size:12px;letter-spacing:.2em;font-variant-numeric:tabular-nums}
.hint{position:absolute;left:50%;bottom:32px;transform:translateX(-50%);font-size:11px;letter-spacing:.24em;text-transform:uppercase;display:flex;flex-direction:column;align-items:center;gap:12px}
.hint::after{content:"";width:1.5px;height:44px;background:currentColor;animation:drop 1.6s ease-in-out infinite}
@keyframes drop{0%{transform:scaleY(0);transform-origin:top}50%{transform:scaleY(1);transform-origin:top}51%{transform-origin:bottom}100%{transform:scaleY(0);transform-origin:bottom}}
.nav{position:fixed;right:30px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:14px;z-index:6;pointer-events:auto;color:var(--fg)}
.nav button{position:relative;width:18px;height:18px;background:none;border:0;cursor:pointer;display:grid;place-items:center;color:inherit}
.nav button::after{content:"";width:8px;height:8px;border-radius:50%;border:2px solid currentColor;transition:all .35s cubic-bezier(.34,1.56,.64,1)}
.nav button.on::after{background:currentColor;transform:scale(1.35)}
.nav button i{position:absolute;right:28px;top:50%;transform:translateY(-50%);font:11px/1 Inter,sans-serif;font-style:normal;letter-spacing:.14em;white-space:nowrap;opacity:0;transition:opacity .3s}
.nav button:hover i{opacity:.8}
.foot{position:absolute;left:32px;bottom:28px;font-size:11px;letter-spacing:.1em;opacity:.6}
@media (max-width:720px){.brand span{display:none}}
@media (orientation:portrait){
  .shape{left:var(--ml,var(--dl));top:var(--mt,var(--dt));bottom:var(--mb,var(--db));width:var(--mw,var(--dw));height:var(--mh,var(--dh))}
  .shape.txt .fx{font-size:var(--mfs,var(--dfs))}
  .shape.geo .fx{border-radius:var(--mr,var(--dr))}
  .shape.mhide{display:none}
  .copy{left:6vw;top:9vh;transform:none;max-width:88vw}
  .copy .k{font-size:11px;margin-bottom:14px}
  .copy h1{font-size:clamp(36px,11vw,58px)}
  .copy p{max-width:88vw;font-size:14px;margin-top:16px;line-height:1.5}
  .copy .tags{margin-top:14px;gap:8px}.copy .tags span{font-size:11px;padding:5px 10px}
  .copy .links{margin-top:20px;gap:18px;font-size:13px;flex-wrap:wrap}
  .nav{right:10px;gap:10px}
  .counter{right:22px}
  .gal{padding:3vw;border-radius:4vw}.gal img{border-radius:2.5vw}.gal figure{margin-bottom:4vw}
  .gal figcaption{padding:2.5vw .5vw 0;gap:3vw}.gal figcaption strong{font-size:14px}.gal figcaption span{font-size:12px}.gal figcaption b{font-size:22px}
  .car{gap:3vw}.car .frame{border-radius:4vw}.car .ctl{gap:3vw}.car .ctl button{width:36px;height:36px;font-size:14px}.car .dots{gap:6px}.car .dots i{width:6px;height:6px}
  .car .cover b{font-size:14vw;left:5vw;top:3vw}.car .cover i{border-left-width:8vw;border-top-width:5vw;border-bottom-width:5vw}
  .tl{padding:4vw;border-radius:4vw}
  .tli{grid-template-columns:20vw 4vw 1fr;gap:0 2vw;padding-bottom:5vw}
  .tli .when{font-size:10px;padding-top:2px}.tli .dot{width:3vw;height:3vw;margin-top:1vw}
  .tli::before{left:calc(20vw + 2vw + 1.5vw - 1px);top:4vw}
  .tli strong{font-size:14px}.tli span,.tli p{font-size:12px;max-width:none}.tli ul{font-size:12px;margin-left:12px}.tli .stack em{font-size:10px;padding:2px 8px}.tli .chev{font-size:16px}.tli{border-radius:2vw;margin:0 -2vw;padding-left:2vw;padding-right:2vw}
  .copy .tags span{font-size:10px;padding:4px 8px}
  .foot,.hint{display:none}
}
</style>

<script>
window.addEventListener('error',e=>{const d=document.createElement('div');d.style.cssText='position:fixed;left:16px;bottom:56px;z-index:99;font:12px monospace;color:#fff;background:#000;padding:6px 10px;max-width:80vw;white-space:pre-wrap';d.textContent='Error: '+e.message;document.body.appendChild(d)});

/* ---------- helpers ---------- */
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const smooth=(a,b,v)=>{const t=clamp((v-a)/(b-a),0,1);return t*t*(3-2*t)};
const easeInCubic=t=>t*t*t;
const easeOutQuad=t=>1-(1-t)*(1-t);
const AOUT=.5; // outgoing scene is gone by this fraction of the transition
const easeOutBack=(t,s=1.7)=>{const c3=s+1;return 1+c3*Math.pow(t-1,3)+s*Math.pow(t-1,2)};
const easeOutElastic=t=>t<=0?0:t>=1?1:Math.pow(2,-10*t)*Math.sin((t*10-.75)*(2*Math.PI/3))+1;
const easeOutBounce=t=>{const n=7.5625,d=2.75;if(t<1/d)return n*t*t;if(t<2/d)return n*(t-=1.5/d)*t+.75;if(t<2.5/d)return n*(t-=2.25/d)*t+.9375;return n*(t-=2.625/d)*t+.984375};
const easeOutExpo=t=>t>=1?1:1-Math.pow(2,-10*t);

/* ---------- palette ---------- */
const C={coral:'#ff5a3c',yellow:'#ffc93c',blue:'#2f4bff',ink:'#141414',cream:'#f4efe6',mint:'#19c37d',pink:'#ff8fb1',lilac:'#d9d3ff'};

/* ---------- scenes ---------- */
/* shape: {t:'rect'|'circle'|'tri'|'txt', x,y (vw/vh %), w,h (strings with units), c color, r border-radius, rot, d delay(0-.5), txt, fs} */
/* ---------- abstract colour-block figure ---------- */
function fig(pose,c){
  const bar=(x1,y1,x2,y2,w,col)=>`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${col}" stroke-width="${w}" stroke-linecap="round"/>`;
  const head=(x,y,r)=>`<circle cx="${x}" cy="${y}" r="${r}" fill="${c.head}"/>`;
  const bun=(x,y,r)=>`<circle cx="${x}" cy="${y}" r="${r}" fill="${c.hair}"/>`;
  let body='';
  switch(pose){
    case 'bust':
      body=`<path d="M22 260 L22 190 A78 78 0 0 1 178 190 L178 260 Z" fill="${c.body}"/>`+bar(140,225,192,124,28,c.body)+`<circle cx="194" cy="108" r="17" fill="${c.body}"/>`+head(100,104,44)+bun(140,70,18);break;
    case 'point':
      body=`<rect x="68" y="70" width="64" height="96" rx="32" fill="${c.body}"/>`+bar(84,160,78,250,22,c.body)+bar(116,160,124,250,22,c.body)+bar(126,92,192,68,20,c.body)+`<circle cx="194" cy="66" r="12" fill="${c.body}"/>`+bar(74,96,66,164,20,c.body)+head(100,40,26)+bun(122,20,11);break;
    case 'dance':{
      const one=(col,op)=>`<g opacity="${op}"><g transform="rotate(-8 100 120)"><rect x="68" y="70" width="64" height="96" rx="32" fill="${col}"/></g>`+bar(126,86,176,22,20,col)+bar(74,86,28,34,20,col)+bar(86,160,58,246,22,col)+bar(116,160,152,236,22,col)+(op===1?head(100,40,26)+bun(122,20,11):`<circle cx="100" cy="40" r="26" fill="${col}"/>`)+`</g>`;
      body=`<g transform="translate(-40 0)">${one(c.hair,.28)}</g><g transform="translate(-20 0)">${one(c.hair,.5)}</g>${one(c.body,1)}`;break}
    case 'type':
      body=`<rect x="98" y="152" width="100" height="10" rx="5" fill="${c.body}"/>`+bar(176,78,168,138,8,c.body)+bar(112,140,178,140,8,c.body)+`<rect x="40" y="82" width="60" height="84" rx="28" fill="${c.body}"/>`+bar(90,112,148,138,20,c.body)+bar(62,166,62,250,22,c.body)+bar(62,166,108,166,22,c.body)+bar(108,166,108,250,22,c.body)+head(70,50,26)+bun(50,30,11)+`<rect x="150" y="70" width="34" height="6" fill="${c.accent}"/>`;break;
    case 'launch':
      body=`<rect x="68" y="70" width="64" height="96" rx="32" fill="${c.body}"/>`+bar(84,160,78,250,22,c.body)+bar(116,160,124,250,22,c.body)+bar(126,88,168,26,20,c.body)+bar(74,96,60,150,20,c.body)+head(100,40,26)+bun(122,20,11)+`<path d="M160 22 L200 4 L182 40 Z" fill="${c.accent}"/>`;break;
    case 'wave':
      body=`<rect x="68" y="70" width="64" height="96" rx="32" fill="${c.body}"/>`+bar(84,160,78,250,22,c.body)+bar(116,160,124,250,22,c.body)+bar(126,90,178,38,20,c.body)+`<circle cx="180" cy="34" r="13" fill="${c.body}"/>`+bar(74,96,66,164,20,c.body)+head(100,40,26)+bun(122,20,11);break;
  }

    switch(type){
      case 'up':tr=`translateY(${-po*H*.5}px) scaleY(${1+po*.6})`;A.el.style.transformOrigin='50% 100%';break;
      case 'snap':tr=`translateY(${po*H*.7}px) scaleY(${1+po*.9})`;A.el.style.transformOrigin='50% 0%';break;
      case 'right':tr=`translateX(${-po*W*.55}px) skewX(${-po*10}deg)`;A.el.style.transformOrigin='0% 50%';break;
      case 'diag':tr=`translateX(${-po*W*.5}px) rotate(${-po*9}deg)`;A.el.style.transformOrigin='0% 100%';break;
      case 'blob':tr=`scale(${1+po*.35})`;A.el.style.transformOrigin='50% 50%';A.el.style.opacity=1-po;break;
    }
    if(type!=='blob')A.el.style.opacity=1-smooth(.55,1,po);
    A.el.style.transform=tr+` scaleY(${1+sq*(type==='right'||type==='diag'?0:1)}) scaleX(${1+sq*(type==='right'||type==='diag'?1:0)})`;
    A.shapes.forEach(sh=>{sh.el.style.transform=`rotate(${sh.rot}deg)`;sh.el.style.opacity=1});
    A.copyParts.forEach(c=>{c.el.style.transform='none';c.el.style.opacity=1});
  }
  /* incoming scene B */
  if(f>T0){
    B.el.style.transform=`scaleY(${1+sq}) `;B.el.style.transformOrigin='50% 100%';B.el.style.opacity=1;
    const pi=f>=T1?1:tt;
    B.shapes.forEach(sh=>{const q=clamp((pi*1.5-sh.d)/(1),0,1);let tr='';
      switch(type){
        case 'up':tr=`translateY(${(1-easeOutBack(q,1.6))*H*.45}px)`;break;
        case 'snap':tr=`translateY(${-(1-easeOutBounce(q))*H*.45}px)`;break;
        case 'right':tr=`translateX(${(1-easeOutBack(q,1.4))*W*.4}px) skewX(${(1-q)*-8}deg)`;break;
        case 'diag':tr=`translateX(${(1-easeOutBack(q,1.4))*W*.35}px) rotate(${(1-q)*10}deg)`;break;
        case 'blob':tr=`scale(${easeOutBack(q,2.2)})`;break;
      }
      sh.el.style.transform=tr+` rotate(${sh.rot}deg)`;
      sh.el.style.opacity=smooth(0,.45,q)});
    B.copyParts.forEach(c=>{const q=clamp((pi*1.6-c.d-.25),0,1);const e=easeOutBack(q,1.1);
      c.el.style.transform=`translateY(${(1-e)*60}px)`;c.el.style.opacity=q});
  }

  /* UI */
  progress.style.width=(r*100)+'%';
  const cn=Math.round(s)+1;counter.textContent=String(cn).padStart(2,'0')+' / '+String(N).padStart(2,'0');
  hint.style.opacity=1-smooth(.01,.05,r);
  navBtns.forEach((b,j)=>b.classList.toggle('on',j===Math.round(s)));
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
/* random letter pops on the current scene */
let curBase=0;
(function tick(){const sc=S[curBase];if(sc&&sc.el.classList.contains('on')&&sc.el._playRandomLetter)sc.el._playRandomLetter();setTimeout(tick,3200+Math.random()*1600)})();
</script>
